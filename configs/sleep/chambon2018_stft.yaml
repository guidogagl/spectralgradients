# STFT benchmark configuration for chambon2018 model
# Usage: python sleep/benchmark.py --config configs/sleep/chambon2018_stft.yaml --explainer <E> --max-samples <N> --seed 42

model: chambon2018
explainers:
  - IG-time
  - IG-bal
  - IG-freq
  - Sal-time
  - Sal-bal
  - Sal-freq
  - IxG-time
  - IxG-bal
  - IxG-freq
max_samples: 200
gpu: 0
seed: 42

# SpectralGradients specific parameters (not used for STFT)
sg:
  path: shapley
  steps: 10
  perms: 20
  freq_step: 2.0
  batch_size: 10

# STFT-specific parameters
stft:
  real_valued: true
  steps: 1290  # sg_steps(10) x n_bands(129)

# Metrics parameters
metrics:
  conf_thresh: 0.6
  freq_patch_size: 1
  time_patch_size: 50

# Output options
output:
  save_samples: false
  save_attributions: false
