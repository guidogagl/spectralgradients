# STFT benchmark configuration for audio
model: audio-wavcnn
explainers:
  - IG-time
  - IG-bal
  - IG-freq
  - Sal-time
  - Sal-bal
  - Sal-freq
  - IxG-time
  - IxG-bal
  - IxG-freq
max_samples: 200
gpu: 0
seed: 42

sg:
  path: shapley
  steps: 10
  perms: 20
  freq_step: 100.0
  batch_size: 2

stft:
  real_valued: true
  steps: 810  # sg_steps(10) x n_bands(81)

metrics:
  conf_thresh: 0.01      # Lower threshold for audio model
  freq_patch_size: 20
  time_patch_size: 500

output:
  save_samples: false
  save_attributions: false
